services:
  - type: web
    name: serk-technologies-group
    env: node
    plan: free
    region: frankfurt # Low latency to East Africa / Europe
    buildCommand: npm install --include=dev && npx prisma generate && (npx prisma db push --accept-data-loss || true) && (npx tsx tools/sync-on-startup.ts || true) && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with Neon connection string (?sslmode=require)
      - key: ADMIN_EMAIL
        value: admin@serkgroup.com
      - key: ADMIN_PASSWORD
        sync: false # Choose a secure password in Render Dashboard
      - key: SESSION_SECRET
        generateValue: true # Render will generate a cryptographically random secret
